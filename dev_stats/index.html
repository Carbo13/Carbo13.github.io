<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Statistiche — Kiaro</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <style>
      :root {
        --bg: #050506;
        --panel: #0c0c0f;
        --panel-2: #121216;
        --border: #1d1d23;
        --border-2: #2a2a33;
        --text: #f4f4f5;
        --text-2: #a1a1aa;
        --text-3: #6b6b76;
        --green: #4ade80;
        --lime: #bef264;
        --cyan: #22d3ee;
        --orange: #fb923c;
        --red: #f87171;
        --blue: #60a5fa;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
      button, input, select { font: inherit; color: inherit; }
      a { color: var(--cyan); }
      [hidden] { display: none !important; }
      .wrap { width: min(1280px, 100% - 32px); margin: 0 auto; padding: 20px 0 64px; }

      /* Accesso */
      .login { width: min(380px, 100% - 32px); margin: 14vh auto; padding: 28px; border-radius: 16px; background: var(--panel); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
      .login h1 { margin: 0; font-size: 20px; display: flex; gap: 10px; align-items: center; }
      .login p { margin: 0; color: var(--text-3); }
      .input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--panel-2); outline: none; }
      .input:focus { border-color: var(--cyan); }
      .err { color: var(--red); min-height: 1.4em; margin: 0; }

      /* Barra superiore */
      .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
      .top h1 { margin: 0 auto 0 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
      .btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--panel-2); cursor: pointer; font-weight: 500; }
      .btn:hover { border-color: var(--text-3); }
      .btn-primary { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
      .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--panel); }
      .seg button { padding: 6px 12px; border-radius: 9px; border: 0; background: none; color: var(--text-2); cursor: pointer; font-weight: 500; }
      .seg button[aria-pressed=true] { background: var(--panel-2); color: var(--lime); box-shadow: inset 0 0 0 1px var(--border-2); }
      .seg button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-left: 6px; vertical-align: 2px; }
      .check { display: flex; align-items: center; gap: 6px; color: var(--text-2); cursor: pointer; }
      .check input { accent-color: var(--green); }
      .muted { color: var(--text-3); font-size: 13px; }
      .banner { padding: 10px 14px; border-radius: 12px; border: 1px solid #3b2a12; background: #1a1206; color: #fdba74; margin-bottom: 14px; font-size: 13px; }

      /* Contenuti */
      .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
      .kpi { padding: 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); }
      .kpi .k { color: var(--text-2); font-size: 13px; }
      .kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 2px 0; }
      .kpi .s { color: var(--text-3); font-size: 12.5px; }
      .card { padding: 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 14px; min-width: 0; }
      .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
      .card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .card-head .muted { margin-left: auto; }
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .grid-main { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 14px; }
      @media (max-width: 900px) { .grid-2, .grid-main { grid-template-columns: 1fr; } }
      .grid-2 > .card, .grid-main > .card { margin-bottom: 0; }
      .row-gap { margin-bottom: 14px; }
      .pos { color: var(--green); }
      .neg { color: var(--red); }
      .big { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }

      /* Grafici */
      .chart { position: relative; }
      .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
      .chart .axis { fill: var(--text-3); font-size: 11px; }
      .chart .grid { stroke: var(--border-2); stroke-dasharray: 3 4; }
      .chart .hot { fill: #ffffff; opacity: 0; }
      .chart g.col:hover .hot, .chart g.col.on .hot { opacity: 0.05; }
      .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; color: var(--text-2); font-size: 12.5px; }
      .mlogo { display: inline-block; width: 15px; height: 15px; margin-right: 7px; vertical-align: -3px; }
      .legend i, .tip i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }
      .tip { position: fixed; z-index: 50; pointer-events: none; min-width: 170px; padding: 10px 12px; border-radius: 12px; background: #16161b; border: 1px solid var(--border-2); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6); font-size: 13px; }
      .tip b { display: block; margin-bottom: 6px; font-weight: 600; }
      .tip .r { display: flex; align-items: center; gap: 10px; margin: 2px 0; }
      .tip .r span:nth-child(2) { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
      .tip .tot { border-top: 1px solid var(--border-2); margin-top: 6px; padding-top: 6px; }
      .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); grid-auto-columns: 13px; justify-content: start; gap: 3px; overflow-x: auto; padding-bottom: 2px; }
      .heat span { width: 13px; height: 13px; border-radius: 3px; background: #15151a; }
      .hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; margin: 10px 0; }
      .hbar .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hbar .val { font-weight: 600; font-variant-numeric: tabular-nums; }
      .hbar .track { grid-column: 1 / -1; height: 5px; border-radius: 4px; background: #1a1a20; overflow: hidden; }
      .hbar .fill { height: 100%; border-radius: 4px; }

      /* Tabelle */
      .tbl { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      th { color: var(--text-3); font-weight: 500; font-size: 12.5px; }
      td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
      tr.click { cursor: pointer; }
      tr.click:hover td { background: var(--panel-2); }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border-2); }
      .b-free { color: var(--text-2); }
      .b-pro { color: var(--cyan); border-color: #164e63; }
      .b-full { color: var(--lime); border-color: #3f6212; }
      .b-byok { color: var(--orange); border-color: #7c2d12; }
      .b-dev { color: #c4b5fd; border-color: #4c1d95; }
      .b-test { color: var(--text-3); border-style: dashed; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* Dettaglio utente */
      .drawer-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40; }
      .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--bg); border-left: 1px solid var(--border-2); z-index: 41; overflow-y: auto; padding: 22px; }
      .drawer > .top h2 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
      .drawer .kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .drawer .kpi .v { font-size: 22px; }
      .notes { color: var(--text-3); font-size: 12.5px; padding-left: 18px; }
    </style>
  </head>

        <div class="seg" id="viewSeg" role="group" aria-label="Dati"></div>

      <section id="view"></section>
      <ul class="notes" id="notes"></ul>
    </main>

          paint();
          var s = $('search');
          if (s && st.focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); st.focusSearch = false; }
        }

        async function load(password) {
          $('err').textContent = '';
          $('enter').disabled = true;
          try {
            var res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: password, excludeTest: $('exclude').checked, view: st.view || undefined }) });
            var body = await res.json().catch(function () { return null; });
            if (!res.ok) throw new Error((body && body.error && body.error.message) || 'Errore ' + res.status);
            st.data = body;
            st.view = body.view;
            try { sessionStorage.setItem(KEY, password); } catch (e) {}
            $('login').hidden = true;
            $('app').hidden = false;
            render();
          } catch (e) {
            try { sessionStorage.removeItem(KEY); } catch (x) {}
            $('app').hidden = true;
            $('login').hidden = false;
            $('err').textContent = e.message === 'Failed to fetch' ? 'Server non raggiungibile' : e.message;
          } finally {
            $('enter').disabled = false;
          }
        }

        $('login').addEventListener('submit', function (e) { e.preventDefault(); load($('pw').value); });
        $('refresh').addEventListener('click', function () { load(pw()); });
        $('exclude').addEventListener('change', function () { load(pw()); });
        $('logout').addEventListener('click', function () {
          try { sessionStorage.removeItem(KEY); } catch (e) {}
          st.data = null; st.view = null; st.user = null;
          $('pw').value = '';
          $('drawer').innerHTML = '';
          $('app').hidden = true;
          $('login').hidden = false;
        });
        document.addEventListener('click', function (e) {
          var b = e.target.closest('[data-tab],[data-range],[data-view],[data-user],[data-close]');
          if (!b) return;
          if (b.hasAttribute('data-tab')) { st.tab = b.getAttribute('data-tab'); render(); }
          else if (b.hasAttribute('data-range')) { st.range = Number(b.getAttribute('data-range')); render(); }
          else if (b.hasAttribute('data-view')) { st.view = b.getAttribute('data-view'); st.user = null; load(pw()); }
          else if (b.hasAttribute('data-user')) { st.user = b.getAttribute('data-user'); hideTip(); render(); }
          else if (b.hasAttribute('data-close')) { st.user = null; render(); }
        });
        document.addEventListener('input', function (e) {
          if (e.target.id !== 'search') return;
          st.q = e.target.value;
          st.focusSearch = true;
          render();
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.user) { st.user = null; render(); } });
        if (!API) $('err').textContent = 'Backend non configurato in questa pubblicazione.';
        else if (pw()) load(pw());
      })();
    </script>
  </body>
</html>
